# Every push to main builds the image and pushes it to ghcr.io tagged with
# the 12-character commit SHA. The cluster repo pins that tag; bumping it
# there is the deploy.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: APP_VERSION=${{ steps.tag.outputs.sha }}
          tags: |
            ghcr.io/aaarrrccc/plvr-convert:${{ steps.tag.outputs.sha }}
            ghcr.io/aaarrrccc/plvr-convert:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: echo "ghcr.io/aaarrrccc/plvr-convert:${{ steps.tag.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
